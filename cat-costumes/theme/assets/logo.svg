<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="Catwalk Club">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FF8AA3"/><stop offset="1" stop-color="#E84E70"/></linearGradient>
  </defs>
  <circle cx="60" cy="62" r="54" fill="url(#g)"/>
  <!-- ears -->
  <path d="M30 50 L26 18 L52 36 Z" fill="#FFF8F0"/><path d="M90 50 L94 18 L68 36 Z" fill="#FFF8F0"/>
  <path d="M34 46 L32 27 L48 38 Z" fill="#FFC7D3"/><path d="M86 46 L88 27 L72 38 Z" fill="#FFC7D3"/>
  <!-- head -->
  <ellipse cx="60" cy="66" rx="34" ry="30" fill="#FFF8F0"/>
  <!-- crown -->
  <path d="M42 30 L48 16 L56 27 L60 12 L64 27 L72 16 L78 30 Z" fill="#FFD166" stroke="#E6A800" stroke-width="2" stroke-linejoin="round" transform="rotate(-12 60 24) translate(0 -2)"/>
  <!-- eyes: content, closed -->
  <path d="M42 62 q6 -7 12 0" stroke="#3D2B4F" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  <path d="M66 62 q6 -7 12 0" stroke="#3D2B4F" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  <!-- nose + mouth -->
  <path d="M56 71 h8 l-4 5 z" fill="#E84E70"/>
  <path d="M60 76 q-6 6 -12 2 M60 76 q6 6 12 2" stroke="#3D2B4F" stroke-width="3" fill="none" stroke-linecap="round"/>
  <!-- whiskers -->
  <path d="M22 68 h16 M23 76 h15 M82 68 h16 M82 76 h15" stroke="#3D2B4F" stroke-width="2.5" stroke-linecap="round" opacity=".7"/>
  <!-- bow tie -->
  <path d="M46 98 l12 6 l12 -6 v14 l-12 -6 l-12 6 z" fill="#3D2B4F"/><circle cx="58" cy="105" r="3.2" fill="#FFD166"/>
</svg>
